<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dungeonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c14" />
      <stop offset="50%" stop-color="#043324" />
      <stop offset="100%" stop-color="#082117" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dungeonBg)" />

  <!-- Procedural Dungeon Grid / Tiles -->
  <g stroke="#065f46" stroke-width="1" opacity="0.3">
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#10b981" stroke-width="0.5" />
    </pattern>
    <rect width="800" height="450" fill="url(#grid)" />
  </g>

  <!-- Dungeon Rooms (BSP layout representation) -->
  <rect x="80" y="70" width="160" height="120" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="4" opacity="0.7" />
  <rect x="300" y="110" width="200" height="180" fill="#064e3b" stroke="#34d399" stroke-width="2.5" rx="6" opacity="0.8" />
  <rect x="560" y="60" width="170" height="130" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="4" opacity="0.7" />
  <rect x="140" y="260" width="120" height="110" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="4" opacity="0.7" />
  <rect x="530" y="250" width="190" height="120" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="4" opacity="0.7" />

  <!-- Corridors connecting rooms -->
  <line x1="240" y1="130" x2="300" y2="130" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="500" y1="130" x2="560" y2="130" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="190" x2="200" y2="260" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="620" y1="190" x2="620" y2="250" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="400" y1="290" x2="400" y2="330" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  <line x1="260" y1="330" x2="530" y2="330" stroke="#34d399" stroke-width="8" stroke-linecap="round" />

  <!-- Central Boss / Magic Rune in Room 2 -->
  <circle cx="400" cy="200" r="60" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="10 5" filter="url(#glowGreen)" />
  <polygon points="400,150 440,230 360,230" fill="none" stroke="#6ee7b7" stroke-width="2" />
  <polygon points="400,250 440,170 360,170" fill="none" stroke="#6ee7b7" stroke-width="2" />
  <circle cx="400" cy="200" r="14" fill="#a7f3d0" filter="url(#glowGreen)" />

  <!-- A* Pathfinding Nodes Visualizer -->
  <path d="M 160 130 L 220 130 L 260 130 L 330 150 L 400 200" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="6 4" filter="url(#glowGreen)" />
  <circle cx="160" cy="130" r="6" fill="#38bdf8" />
  <circle cx="220" cy="130" r="4" fill="#fef08a" />
  <circle cx="260" cy="130" r="4" fill="#fef08a" />
  <circle cx="330" cy="150" r="4" fill="#fef08a" />

  <text x="40" y="415" font-family="'Orbitron', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">RIFT WALKER</text>
  <text x="40" y="435" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#34d399" letter-spacing="2">UNITY • PROCEDURAL GENERATION &amp; A* PATHFINDING</text>
</svg>
