<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05141f" />
      <stop offset="50%" stop-color="#0a2a3f" />
      <stop offset="100%" stop-color="#031826" />
    </linearGradient>
    <linearGradient id="blockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blockGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="blockGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blockGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#stackBg)" />

  <!-- Background decorative grid circles -->
  <g stroke="#0284c7" stroke-width="1" opacity="0.15" fill="none">
    <circle cx="400" cy="225" r="100" />
    <circle cx="400" cy="225" r="180" />
    <circle cx="400" cy="225" r="260" stroke-dasharray="8 8" />
  </g>

  <!-- Base Platform Block -->
  <g transform="translate(400, 340)">
    <!-- Top -->
    <polygon points="0,-25 110,0 0,25 -110,0" fill="#0f2942" stroke="#38bdf8" stroke-width="2" />
    <!-- Left -->
    <polygon points="-110,0 0,25 0,55 -110,30" fill="#091b2c" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Right -->
    <polygon points="0,25 110,0 110,30 0,55" fill="#061320" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Stacked Block 1 (Cyan) -->
  <g transform="translate(400, 290)">
    <polygon points="0,-25 100,0 0,25 -100,0" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2" />
    <polygon points="-100,0 0,25 0,50 -100,25" fill="#0284c7" />
    <polygon points="0,25 100,0 100,25 0,50" fill="#0369a1" />
  </g>

  <!-- Stacked Block 2 (Emerald) -->
  <g transform="translate(400, 240)">
    <polygon points="0,-25 90,0 0,25 -90,0" fill="#34d399" stroke="#a7f3d0" stroke-width="2" />
    <polygon points="-90,0 0,25 0,50 -90,25" fill="#059669" />
    <polygon points="0,25 90,0 90,25 0,50" fill="#047857" />
  </g>

  <!-- Stacked Block 3 (Purple) -->
  <g transform="translate(400, 190)">
    <polygon points="0,-25 80,0 0,25 -80,0" fill="#a855f7" stroke="#e9d5ff" stroke-width="2" />
    <polygon points="-80,0 0,25 0,50 -80,25" fill="#7e22ce" />
    <polygon points="0,25 80,0 80,25 0,50" fill="#6b21a8" />
  </g>

  <!-- Slicing Dynamic Moving Block (Rose/Crimson) & Sliced Fragment Falling -->
  <!-- Main aligned slice -->
  <g transform="translate(390, 140)">
    <polygon points="0,-25 65,0 0,25 -65,0" fill="#fb7185" stroke="#ffe4e6" stroke-width="2" />
    <polygon points="-65,0 0,25 0,50 -65,25" fill="#e11d48" />
    <polygon points="0,25 65,0 65,25 0,50" fill="#be123c" />
  </g>

  <!-- Falling sliced piece (Physics Rigidbody simulation) -->
  <g transform="translate(485, 175) rotate(22)">
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#fb7185" opacity="0.8" stroke="#ffe4e6" stroke-width="1.5" />
    <polygon points="-20,0 0,20 0,35 -20,15" fill="#e11d48" opacity="0.8" />
    <polygon points="0,20 20,0 20,15 0,35" fill="#be123c" opacity="0.8" />
  </g>

  <!-- Slice Laser Plane Line & Particle Sparks -->
  <line x1="420" y1="90" x2="490" y2="210" stroke="#ffffff" stroke-width="3" filter="url(#stackGlow)" />
  <circle cx="455" cy="150" r="8" fill="#ffffff" filter="url(#stackGlow)" />
  <circle cx="440" cy="140" r="3" fill="#fef08a" />
  <circle cx="470" cy="165" r="3" fill="#fef08a" />
  <circle cx="460" cy="130" r="2.5" fill="#38bdf8" />
  <circle cx="480" cy="180" r="2" fill="#fb7185" />

  <!-- Combo Floating Indicator -->
  <text x="560" y="130" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#34d399" filter="url(#stackGlow)">COMBO x4!</text>
  <text x="560" y="152" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#94a3b8">PERFECT SLICE</text>

  <text x="40" y="410" font-family="'Orbitron', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">STACK MASTER</text>
  <text x="40" y="432" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#38bdf8" letter-spacing="2">UNITY • C# MESH SLICING &amp; PHYSICS STACKING</text>
</svg>
