<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1338" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="portalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Perspective Grid -->
  <g stroke="#7e22ce" stroke-width="1" opacity="0.35">
    <line x1="0" y1="450" x2="400" y2="225" />
    <line x1="160" y1="450" x2="400" y2="225" />
    <line x1="320" y1="450" x2="400" y2="225" />
    <line x1="480" y1="450" x2="400" y2="225" />
    <line x1="640" y1="450" x2="400" y2="225" />
    <line x1="800" y1="450" x2="400" y2="225" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="235" x2="800" y2="235" />
  </g>

  <!-- Temporal Ghost Clones (Echoes) -->
  <g opacity="0.25" transform="translate(320, 160) scale(0.85)">
    <polygon points="50,10 70,80 30,80" fill="#a855f7" />
    <circle cx="50" cy="5" r="12" fill="#c084fc" />
    <rect x="25" y="45" width="50" height="8" rx="4" fill="#00f0ff" />
  </g>
  <g opacity="0.5" transform="translate(360, 175) scale(0.92)">
    <polygon points="50,10 70,80 30,80" fill="#c084fc" />
    <circle cx="50" cy="5" r="12" fill="#e9d5ff" />
    <rect x="25" y="45" width="50" height="8" rx="4" fill="#00f0ff" />
  </g>

  <!-- Central Time Vortex / Portal -->
  <circle cx="400" cy="200" r="110" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="16 8" filter="url(#glow)" />
  <circle cx="400" cy="200" r="80" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="400" cy="200" r="50" fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Main Hero Character Silhouette -->
  <g transform="translate(365, 170)">
    <!-- Body -->
    <path d="M35,30 L55,100 L15,100 Z" fill="#ffffff" filter="url(#glow)" />
    <!-- Head/Visor -->
    <circle cx="35" cy="18" r="14" fill="#00f0ff" />
    <rect x="25" y="14" width="20" height="6" rx="3" fill="#ffffff" />
    <!-- Glowing Weapon / Arc -->
    <line x1="45" y1="55" x2="85" y2="35" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="85" cy="35" r="5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Rewind Curves & Particles -->
  <path d="M 220 280 C 260 140, 540 140, 580 280" fill="none" stroke="url(#portalGlow)" stroke-width="3" stroke-dasharray="6 6" filter="url(#glow)" />
  <circle cx="270" cy="190" r="4" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="530" cy="190" r="4" fill="#e879f9" filter="url(#glow)" />
  <circle cx="380" cy="110" r="3" fill="#ffffff" />

  <!-- Game Title Watermark -->
  <text x="40" y="415" font-family="'Orbitron', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">CHRONO SHIFT</text>
  <text x="40" y="435" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#00f0ff" letter-spacing="2">UNREAL ENGINE 5 • C++ REWIND MECHANICS</text>
</svg>
