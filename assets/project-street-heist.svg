<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heistSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#14172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="neonRoad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181829" />
      <stop offset="100%" stop-color="#0a0c16" />
    </linearGradient>
    <linearGradient id="sirenCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="sirenRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="heistGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#heistSky)" />

  <!-- City Skyline Silhouette -->
  <g fill="#0c0e1a">
    <rect x="40" y="140" width="70" height="180" />
    <rect x="130" y="110" width="90" height="210" />
    <rect x="240" y="160" width="60" height="160" />
    <rect x="320" y="80" width="100" height="240" />
    <rect x="440" y="130" width="85" height="190" />
    <rect x="545" y="95" width="75" height="225" />
    <rect x="640" y="150" width="110" height="170" />
  </g>

  <!-- Glowing Skyscraper Windows -->
  <g fill="#fef08a" opacity="0.3">
    <rect x="55" y="160" width="6" height="8" />
    <rect x="75" y="180" width="6" height="8" />
    <rect x="150" y="130" width="6" height="8" />
    <rect x="180" y="170" width="6" height="8" />
    <rect x="340" y="100" width="8" height="10" />
    <rect x="370" y="140" width="8" height="10" />
    <rect x="460" y="150" width="6" height="8" />
    <rect x="560" y="120" width="6" height="8" />
    <rect x="670" y="170" width="6" height="8" />
  </g>

  <!-- Police Siren Searchlights in Sky -->
  <polygon points="120,320 0,0 200,0" fill="url(#sirenRed)" opacity="0.15" />
  <polygon points="680,320 600,0 800,0" fill="url(#sirenCyan)" opacity="0.15" />

  <!-- Perspective Asphalt Street / Highway -->
  <polygon points="400,220 800,450 0,450" fill="url(#neonRoad)" />

  <!-- Neon Lane Divider Speed Lines -->
  <line x1="400" y1="220" x2="400" y2="450" stroke="#f59e0b" stroke-width="4" stroke-dasharray="25 20" filter="url(#heistGlow)" />
  <line x1="400" y1="220" x2="160" y2="450" stroke="#00f0ff" stroke-width="2" opacity="0.6" />
  <line x1="400" y1="220" x2="640" y2="450" stroke="#00f0ff" stroke-width="2" opacity="0.6" />

  <!-- Speed Motion Blur Streaks -->
  <line x1="60" y1="360" x2="280" y2="360" stroke="#ff0055" stroke-width="3" opacity="0.7" filter="url(#heistGlow)" />
  <line x1="520" y1="380" x2="750" y2="380" stroke="#00f0ff" stroke-width="3" opacity="0.7" filter="url(#heistGlow)" />
  <line x1="120" y1="410" x2="330" y2="410" stroke="#00f0ff" stroke-width="4" opacity="0.5" filter="url(#heistGlow)" />

  <!-- Parkour Runner Silhouette in Motion -->
  <g transform="translate(390, 260) scale(1.15)">
    <!-- Shadow -->
    <ellipse cx="10" cy="85" rx="25" ry="6" fill="#000000" opacity="0.6" />
    
    <!-- Cyber Hoodie / Runner Silhouette -->
    <!-- Torso leaning forward -->
    <path d="M0,25 L25,45 L15,65 L-5,45 Z" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
    <!-- Glowing Visor / Mask -->
    <circle cx="20" cy="18" r="10" fill="#0f172a" />
    <path d="M18,16 L28,16" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#heistGlow)" />
    <!-- Running Arms -->
    <path d="M5,35 L-15,45 L-25,40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <path d="M22,35 L38,40 L45,55" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <!-- Running Legs in stride -->
    <path d="M12,65 L30,80 L40,82" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <path d="M0,65 L-15,75 L-22,65" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <!-- Glowing Money Bag / Loot Satchel -->
    <rect x="-10" y="32" width="14" height="14" rx="3" fill="#f59e0b" filter="url(#heistGlow)" />
  </g>

  <!-- Title Watermark -->
  <text x="40" y="410" font-family="'Orbitron', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">STREET HEIST</text>
  <text x="40" y="432" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#00f0ff" letter-spacing="2">UNREAL ENGINE • ENDLESS RUNNER GAMEPLAY</text>
</svg>
